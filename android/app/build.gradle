plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firebase configuration is injected by CI when GOOGLE_SERVICES_JSON_BASE64 is set.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// A chave privada nunca faz parte do repositório. O CI injeta estes valores
// somente nos builds autorizados a gerar uma versão distribuível.
def releaseStoreFilePath = System.getenv('ANDROID_RELEASE_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('ANDROID_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() } &&
    new File(releaseStoreFilePath ?: '').isFile()

android {
    namespace 'br.com.editalradar.app'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.editalradar.app'
        minSdk 24
        targetSdk 36
        versionCode 25
        versionName '1.3.12'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            create('release') {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.getByName('release')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}
