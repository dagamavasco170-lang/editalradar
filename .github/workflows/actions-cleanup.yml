name: Limpeza automática do GitHub Actions

on:
  schedule:
    # Horário fora do início da hora para reduzir atraso do cron.
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remover runs e artifacts antigos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Limpeza segura de execuções e artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const cutoffRuns = Date.now() - 45 * 24 * 60 * 60 * 1000;
            const cutoffArtifacts = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const keepPerWorkflow = 12;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const completedRuns = runs
              .filter(run => run.status === "completed")
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const keptByWorkflow = new Map();
            const deleteRuns = [];
            for (const run of completedRuns) {
              const key = String(run.workflow_id);
              const kept = keptByWorkflow.get(key) || 0;
              if (kept < keepPerWorkflow) {
                keptByWorkflow.set(key, kept + 1);
                continue;
              }
              if (new Date(run.created_at).getTime() < cutoffRuns) {
                deleteRuns.push(run);
              }
            }
            let deletedRuns = 0;
            for (const run of deleteRuns) {
              // Guard rails: never delete active runs, keep the latest 12 per workflow,
              // and only delete completed runs older than 45 days.
              if (run.status !== "completed" || new Date(run.created_at).getTime() >= cutoffRuns) continue;
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              deletedRuns++;
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            let deletedArtifacts = 0;
            for (const artifact of artifacts) {
              if (artifact.expired || new Date(artifact.created_at).getTime() >= cutoffArtifacts) continue;
              // Artifacts are independent of active workflow runs; only age-based cleanup.
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              deletedArtifacts++;
            }
            const summary = [
              "## Limpeza automática de Actions",
              "",
              "- Execuções concluídas removidas (mais de 45 dias, mantendo 12 mais recentes por workflow): **" + deletedRuns + "**",
              "- Artifacts removidos (mais de 30 dias): **" + deletedArtifacts + "**",
              "- Execuções em andamento não foram tocadas.",
              "- Limite de retenção: 45 dias para runs; 30 dias para artifacts."
            ].join("\n");
            await core.summary.addRaw(summary).write();
            core.info(summary);
