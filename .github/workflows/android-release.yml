name: Build and publish EditalRadar Android release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editalradar-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Build APK/AAB and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Android security and offline safeguards
        run: node --test scripts/platform-resilience.node-test.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Read Android version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Android version: $VERSION_NAME ($VERSION_CODE)"

      - name: Validate Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

          if [ -f android/app/google-services.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          if "br.com.editalradar.app" not in package_names:
              raise SystemExit("google-services.json não contém br.com.editalradar.app")
          print("Configuração Firebase Android validada.")
          PY
          else
            echo "::warning::google-services.json ausente; o APK será compilado sem inicializar Firebase Cloud Messaging."
          fi

      - name: Build installable APK and test AAB (automatic retry for repository rate limits)
        working-directory: android
        timeout-minutes: 25
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build Android attempt $attempt/3"
            if gradle assembleDebug bundleDebug --no-daemon --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting before automatic retry."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Prepare release assets and checksums
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/EditalRadar-Android-v${APP_VERSION}.apk"
          cp android/app/build/outputs/bundle/debug/app-debug.aab "release-assets/EditalRadar-Android-v${APP_VERSION}-debug.aab"
          test -s "release-assets/EditalRadar-Android-v${APP_VERSION}.apk"
          test -s "release-assets/EditalRadar-Android-v${APP_VERSION}-debug.aab"
          (cd release-assets && sha256sum *.apk *.aab > SHA256SUMS.txt)
          cat > android-release-notes.md <<EOF
          # EditalRadar Android v${APP_VERSION}

          - Versão ${VERSION_CODE} para aparelhos com Android 7.0 ou superior.
          - APK disponível para instalação manual e AAB para testes internos.
          - Mensagens mais simples sobre avisos e conexão.
          - Melhorias na estabilidade e no retorno automático após a conexão ser restabelecida.
          - Experiência de uso aprimorada ao acompanhar concursos e estudar pelo aplicativo.
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EditalRadar-Android-v${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish versioned GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.name }}
          name: EditalRadar Android v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: android-release-notes.md
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
