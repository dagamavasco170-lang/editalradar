name: Build and publish EditalRadar Android release

# API 36 release uses the AndroidX Activity Result contract with Fragment 1.9.1.

on:
  push:
    branches: [main]
    paths:
      - "android/app/src/**"
      - "android/app/build.gradle"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/gradle.properties"
      - "android/gradle/**"
      - "android/gradlew"
      - "android/gradlew.bat"
  pull_request:
    branches: [main]
    paths:
      - "android/app/src/**"
      - "android/app/build.gradle"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/gradle.properties"
      - "android/gradle/**"
      - "android/gradlew"
      - "android/gradlew.bat"
      - ".github/workflows/android-release.yml"
      - "scripts/platform-resilience.node-test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editalradar-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-build:
    name: Build Android app
    permissions:
      contents: read
    outputs:
      release_ready: ${{ steps.signing.outputs.ready }}
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test Android security and offline safeguards
        run: node --test scripts/platform-resilience.node-test.mjs

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Read Android version
        id: version
        shell: bash
        run: |
          VERSION_INFO="$(python3 - <<'PY'
          from pathlib import Path
          lines = Path("android/app/build.gradle").read_text().splitlines()
          name_line = next((line.strip() for line in lines if line.strip().startswith("versionName ")), "")
          code_line = next((line.strip() for line in lines if line.strip().startswith("versionCode ")), "")
          if not name_line or not code_line:
              raise SystemExit("Não foi possível ler a versão Android.")
          print(f"{name_line.split(chr(39), 2)[1]}|{code_line.split()[1]}")
          PY
          )"
          VERSION_NAME="${VERSION_INFO%%|*}"
          VERSION_CODE="${VERSION_INFO#*|}"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Android version: $VERSION_NAME ($VERSION_CODE)"

      - name: Validate Firebase Android configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi

          if [ -f android/app/google-services.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          if "br.com.editalradar.app" not in package_names:
              raise SystemExit("google-services.json não contém br.com.editalradar.app")
          print("Configuração Firebase Android validada.")
          PY
          else
            echo "::warning::google-services.json ausente; o APK será compilado sem inicializar Firebase Cloud Messaging."
          fi

      - name: Configure permanent Android signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set +x
          configured=0
          for value in \
            "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            "$ANDROID_RELEASE_STORE_PASSWORD" \
            "$ANDROID_RELEASE_KEY_ALIAS" \
            "$ANDROID_RELEASE_KEY_PASSWORD"; do
            if [ -n "$value" ]; then
              configured=$((configured + 1))
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chave permanente ainda não configurada. Será feito apenas um build de verificação; nenhuma versão pública será publicada."
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo "::error::A configuração da assinatura está incompleta. Cadastre os quatro segredos exigidos em conjunto."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/editalradar-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" \
            -storetype JKS \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null

          {
            echo "ANDROID_RELEASE_KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Assinatura permanente validada."

      - name: Validate Android release lint on pull requests
        if: github.event_name == 'pull_request'
        working-directory: android
        timeout-minutes: 15
        run: gradle lintRelease --no-daemon --max-workers=2

      - name: Build permanently signed APK and AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        timeout-minutes: 25
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Signed Android build attempt $attempt/3"
            if gradle assembleRelease bundleRelease --no-daemon --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting before automatic retry."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Verify signed APK and AAB before publishing
        if: steps.signing.outputs.ready == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          EXPECTED_ANDROID_SIGNER_SHA256: "6192a29e44539f63b525a9288f95fc98d6deb2f936cef50d624a228ca358595b"
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android SDK Build Tools não encontrados para validar a assinatura."
            exit 1
          fi

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Ferramenta de validação da assinatura APK não encontrada."
            exit 1
          fi
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "::error::Ferramenta AAPT não encontrada para validar o manifesto do APK."
            exit 1
          fi

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          APKSIGNER_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK_PATH")"
          printf '%s\n' "$APKSIGNER_OUTPUT"
          if ! grep -Fq "certificate SHA-256 digest: $EXPECTED_ANDROID_SIGNER_SHA256" <<< "$APKSIGNER_OUTPUT"; then
            echo "::error::O APK não foi assinado com o certificado permanente esperado do EditalRadar."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK_PATH")"
          export BADGING APP_VERSION VERSION_CODE
          python3 - <<'PY'
          import os
          import re

          badging = os.environ["BADGING"]
          package = re.search(
              r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']*)'",
              badging,
              re.MULTILINE,
          )
          expected = ("br.com.editalradar.app", os.environ["VERSION_CODE"], os.environ["APP_VERSION"])
          if package is None or package.groups() != expected:
              raise SystemExit("O APK não corresponde ao identificador ou à versão declarada no Gradle.")

          min_sdk = re.search(r"^sdkVersion:'(\d+)'$", badging, re.MULTILINE)
          target_sdk = re.search(r"^targetSdkVersion:'(\d+)'$", badging, re.MULTILINE)
          if min_sdk is None or min_sdk.group(1) != "24":
              raise SystemExit("O minSdk do APK diverge do mínimo suportado pelo projeto.")
          if target_sdk is None or target_sdk.group(1) != "36":
              raise SystemExit("O targetSdk do APK diverge da política de distribuição do projeto.")
          print("Identidade do pacote, versão e SDK do APK validados.")
          PY

          jarsigner -verify -verbose -certs "$AAB_PATH" >/dev/null
          AAB_CERTS="$(keytool -printcert -jarfile "$AAB_PATH")"
          AAB_SIGNER_SHA256="$(printf '%s\n' "$AAB_CERTS" | awk '/SHA256:/ { gsub(":", "", $2); print tolower($2); exit }')"
          if [ "$AAB_SIGNER_SHA256" != "$EXPECTED_ANDROID_SIGNER_SHA256" ]; then
            echo "::error::O AAB não foi assinado com o mesmo certificado permanente do APK."
            exit 1
          fi
          echo "Assinaturas do APK e do AAB verificadas; certificado permanente confirmado."

      - name: Build verification APK when signing is not configured
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        timeout-minutes: 25
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android verification build attempt $attempt/3"
            if gradle assembleDebug bundleDebug --no-daemon --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting before automatic retry."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Prepare signed release assets
        if: steps.signing.outputs.ready == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/EditalRadar-Android-v${APP_VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/EditalRadar-Android-v${APP_VERSION}.aab"
          test -s "release-assets/EditalRadar-Android-v${APP_VERSION}.apk"
          test -s "release-assets/EditalRadar-Android-v${APP_VERSION}.aab"
          (cd release-assets && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Prepare verification artifact without publishing a release
        if: steps.signing.outputs.ready != 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/EditalRadar-Android-v${APP_VERSION}-verification-only.apk"
          cp android/app/build/outputs/bundle/debug/app-debug.aab "release-assets/EditalRadar-Android-v${APP_VERSION}-verification-only.aab"
          (cd release-assets && sha256sum *.apk *.aab > SHA256SUMS.txt)
          echo "Build de verificação. Não instalar sobre versões existentes nem distribuir como atualização." > release-assets/README.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: EditalRadar-Android-v${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Explain how to enable signed releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing.outputs.ready != 'true'
        run: echo "::notice::O build foi validado, mas a publicação está aguardando a configuração da chave permanente. Consulte ANDROID_SIGNING.md."

  android-smoke:
    name: Install and upgrade on Android 10 emulator
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Download permanently signed release artifact
        if: needs.android-build.outputs.release_ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: EditalRadar-Android-v${{ needs.android-build.outputs.version_name }}
          path: release-assets

      - name: Build debug APK for pull request smoke test
        if: needs.android-build.outputs.release_ready != 'true'
        working-directory: android
        run: gradle assembleDebug --no-daemon --max-workers=2

      - name: Enable KVM when available (software fallback otherwise)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm || true
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM is available; the emulator can use hardware acceleration."
          else
            echo "KVM is unavailable; allowing the Android Emulator software TCG fallback."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Install, upgrade and launch on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RELEASE_READY: ${{ needs.android-build.outputs.release_ready }}
          APP_VERSION: ${{ needs.android-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.android-build.outputs.version_code }}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash "$GITHUB_WORKSPACE/scripts/android-emulator-smoke.sh"

  publish-release:
    name: Publish signed Android release
    needs: [android-build, android-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.android-build.outputs.release_ready == 'true' && needs.android-smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: EditalRadar-Android-v${{ needs.android-build.outputs.version_name }}
          path: release-assets

      - name: Validate published files and checksums
        env:
          APP_VERSION: ${{ needs.android-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.android-build.outputs.version_code }}
        shell: bash
        run: |
          test -n "$APP_VERSION"
          test -n "$VERSION_CODE"
          test -s "release-assets/EditalRadar-Android-v${APP_VERSION}.apk"
          test -s "release-assets/EditalRadar-Android-v${APP_VERSION}.aab"
          test -s "release-assets/SHA256SUMS.txt"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Prepare release notes
        env:
          APP_VERSION: ${{ needs.android-build.outputs.version_name }}
          VERSION_CODE: ${{ needs.android-build.outputs.version_code }}
        shell: bash
        run: |
          cat > android-release-notes.md <<EOF
          # EditalRadar Android v${APP_VERSION}

          - Versão ${VERSION_CODE}.
          - APK e AAB assinados com a chave permanente do EditalRadar.
          - Esta assinatura é mantida nas próximas versões para permitir atualizações diretas.
          - Verificação automática de novas versões, com nova tentativa após falhas temporárias.
          - Download com conferência SHA-256 e validação da assinatura antes de instalar.
          - Instalação encaminhada pelo instalador seguro do Android, com confirmação do usuário.
          - Melhorias de estabilidade, segurança e experiência de uso.
          EOF

      - name: Publish permanently signed GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v${{ needs.android-build.outputs.version_name }}
          name: EditalRadar Android v${{ needs.android-build.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body_path: android-release-notes.md
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
