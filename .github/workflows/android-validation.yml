name: Android validation

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-validation.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-validation.yml"

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Compile Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Compile debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        with:
          name: editalradar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
