name: Relatório automático de falhas do GitHub
on:
  workflow_run:
    workflows:
      - "Test, build and deploy EditalRadar"
      - "Build and publish EditalRadar Android release"
      - "Android emulator smoke test"
      - "Análise de segurança CodeQL"
      - "Monitorar e recuperar automações"
    types: [completed]
permissions:
  actions: read
  issues: write
jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Registrar falhas e encerrar alertas recuperados
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const titlePrefix = `[CI falhou] ${run.name} — ${run.head_branch} (`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const related = issues.filter(issue =>
              !issue.pull_request && issue.title.startsWith(titlePrefix)
            );

            async function isSameOrDescendant(failedSha, successfulSha) {
              try {
                const response = await github.request(
                  "GET /repos/{owner}/{repo}/compare/{base}...{head}",
                  { owner, repo, base: failedSha, head: successfulSha }
                );
                return ["identical", "ahead"].includes(response.data.status);
              } catch (error) {
                core.warning("Não foi possível comparar commits " +
                  failedSha.slice(0, 7) + " e " + successfulSha.slice(0, 7) +
                  ": " + String(error?.message || error).slice(0, 180));
                return false;
              }
            }

            if (run.conclusion === "success") {
              for (const issue of related) {
                const match = issue.body?.match(/\*\*Commit:\*\*\s*([0-9a-f]{40})/i);
                if (!match || !(await isSameOrDescendant(match[1], run.head_sha))) continue;

                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: "A falha foi superada por uma execução bem-sucedida em um commit igual ou posterior da mesma branch.\n\n" +
                    "**Commit validado:** " + run.head_sha + "\n" +
                    "**Execução:** " + run.html_url
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: "closed", state_reason: "completed"
                });
                core.info("Alerta histórico #" + issue.number + " encerrado após recuperação comprovada.");
              }
              return;
            }

            const exactTitle = titlePrefix + run.head_sha.slice(0, 7) + ")";
            if (related.some(issue => issue.title === exactTitle)) {
              core.info("Issue já existe para esta falha; evitando duplicação.");
              return;
            }

            // A execução de falha pode ser reportada depois que um commit seguinte
            // já passou. Nesse caso, não reabrimos um alerta que nasceu obsoleto.
            const recentRuns = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: run.workflow_id,
              branch: run.head_branch, per_page: 30
            });
            for (const candidate of recentRuns.data.workflow_runs) {
              if (candidate.conclusion !== "success" || !candidate.head_sha) continue;
              if (await isSameOrDescendant(run.head_sha, candidate.head_sha)) {
                core.info("Falha histórica já superada por execução bem-sucedida: " + candidate.html_url);
                return;
              }
            }

            const body = [
              "## Falha automatizada detectada",
              "",
              "- **Workflow:** " + run.name,
              "- **Branch:** " + run.head_branch,
              "- **Commit:** " + run.head_sha,
              "- **Conclusão:** " + run.conclusion,
              "- **Executado em:** " + run.updated_at,
              "- **Link da execução:** " + run.html_url,
              "",
              "Os logs completos ficam na aba Actions. O alerta será encerrado automaticamente quando uma execução posterior, no mesmo histórico de commits, confirmar a recuperação."
            ].join("\n");
            await github.rest.issues.create({
              owner, repo, title: exactTitle, body
            });
