name: Análise de segurança CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, java-kotlin]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configurar Java para análise Android
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Configurar Gradle Android
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Compilar Android para análise CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: gradle assembleDebug --no-daemon --max-workers=2
      - name: Executar análise
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
