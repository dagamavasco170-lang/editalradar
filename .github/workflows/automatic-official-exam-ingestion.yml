name: Importar provas e questões oficiais automaticamente

on:
  schedule:
    # 05:40 no horário de Brasília (08:40 UTC); GitHub pode atrasar cron em períodos de alta demanda.
    - cron: "40 8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - publish
      limit:
        description: "Máximo de cadernos processados nesta execução (1 a 12)"
        type: number
        required: false
        default: 4

permissions:
  contents: read

concurrency:
  group: automatic-official-exam-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Descobrir, extrair e validar provas oficiais
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # A agenda publica sem intervenção somente depois da migration ser aplicada e
      # desta variável de repositório ser habilitada pelo responsável pela implantação.
      EXAM_IMPORT_AUTOPUBLISH_ENABLED: ${{ vars.EXAM_IMPORT_AUTOPUBLISH_ENABLED || 'false' }}
      EXAM_IMPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (vars.EXAM_IMPORT_AUTOPUBLISH_ENABLED == 'true' && 'publish' || 'dry-run') }}
      INGESTION_REPORT_PATH: .cache/official-exam-ingestion-report.json
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Poppler e OCR em português
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng

      - name: Validar sintaxe e testes do importador autônomo
        run: |
          node --check scripts/automatic-official-exam-ingestion.mjs
          node --test scripts/automatic-official-exam-ingestion.node-test.mjs scripts/import-official-exam-pdf.node-test.mjs

      - name: Executar ingestão autônoma
        id: ingestion
        run: |
          mkdir -p .cache
          node scripts/automatic-official-exam-ingestion.mjs --mode "$EXAM_IMPORT_MODE" --limit "${{ inputs.limit || 4 }}"

      - name: Salvar relatório da execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingestao-provas-oficiais-${{ github.run_id }}
          path: .cache/official-exam-ingestion-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resumo da execução
        if: always()
        run: |
          if [ -f .cache/official-exam-ingestion-report.json ]; then
            node -e "const r=require('./.cache/official-exam-ingestion-report.json'); console.log('Modo:',r.mode); console.log('Fontes:',r.sourcesChecked); console.log('Documentos:',r.documentsChecked); console.log('Questões extraídas:',r.questionsExtracted); console.log('Prontas para publicação:',r.readyToPublish); console.log('Publicadas:',r.published); console.log('Duplicadas:',r.duplicates); console.log('Quarentena:',r.quarantined); console.log('Falhas:',r.failures.length);"
            cat .cache/official-exam-ingestion-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
