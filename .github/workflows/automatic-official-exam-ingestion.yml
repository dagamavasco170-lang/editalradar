name: Importar provas e questões oficiais automaticamente

on:
  pull_request:
    paths:
      - "scripts/automatic-official-exam-ingestion.mjs"
      - "scripts/automatic-official-exam-ingestion.node-test.mjs"
      - "scripts/import-official-exam-pdf.mjs"
      - "src/data/concursos.js"
      - "src/lib/official-sources.js"
      - ".github/workflows/automatic-official-exam-ingestion.yml"
  schedule:
    # 05:40 no horário de Brasília (08:40 UTC); GitHub pode atrasar cron em períodos de alta demanda.
    - cron: "40 8 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/automatic-official-exam-ingestion.mjs"
      - "scripts/official-exam-sources.json"
      - ".github/workflows/automatic-official-exam-ingestion.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        type: choice
        required: true
        default: stage
        options:
          - dry-run
          - stage
          - publish
      limit:
        description: "Máximo de cadernos processados nesta execução (1 a 15)"
        type: number
        required: false
        default: 15

permissions:
  contents: read

concurrency:
  group: automatic-official-exam-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Descobrir, extrair e validar provas oficiais
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Agenda e push publicam por padrão após as migrations aplicáveis estarem implantadas.
      # Defina EXAM_IMPORT_AUTOPUBLISH_ENABLED=false para manter somente o staging.
      EXAM_IMPORT_AUTOPUBLISH_ENABLED: ${{ vars.EXAM_IMPORT_AUTOPUBLISH_ENABLED || 'true' }}
      EXAM_IMPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (vars.EXAM_IMPORT_AUTOPUBLISH_ENABLED == 'false' && 'stage' || 'publish') }}
      INGESTION_REPORT_PATH: .cache/official-exam-ingestion-report.json
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Poppler e OCR em português
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-eng

      - name: Validar sintaxe e testes do importador autônomo
        run: |
          node --check scripts/automatic-official-exam-ingestion.mjs
          node --test scripts/automatic-official-exam-ingestion.node-test.mjs scripts/import-official-exam-pdf.node-test.mjs

      - name: Executar dry-run de PR sem credenciais Supabase
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          EXAM_IMPORT_MODE: dry-run
          EXAM_IMPORT_AUTOPUBLISH_ENABLED: "false"
        run: |
          mkdir -p .cache
          node scripts/automatic-official-exam-ingestion.mjs --mode dry-run --limit 15

      - name: Executar ingestão agendada ou manual
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXAM_IMPORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (vars.EXAM_IMPORT_AUTOPUBLISH_ENABLED == 'false' && 'stage' || 'publish') }}
        run: |
          mkdir -p .cache
          node scripts/automatic-official-exam-ingestion.mjs --mode "$EXAM_IMPORT_MODE" --limit "${{ inputs.limit || 15 }}"

      - name: Salvar relatório da execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingestao-provas-oficiais-${{ github.run_id }}
          path: .cache/official-exam-ingestion-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resumo da execução
        if: always()
        run: |
          if [ -f .cache/official-exam-ingestion-report.json ]; then
            node -e "const r=require('./.cache/official-exam-ingestion-report.json'); console.log('Modo:',r.mode); console.log('Fontes:',r.sourcesChecked); console.log('Documentos:',r.documentsChecked); console.log('Questões extraídas:',r.questionsExtracted); console.log('Prontas para publicação:',r.readyToPublish); console.log('Pré-cadastradas na fila privada:',r.staged); console.log('Publicadas:',r.published); console.log('Duplicadas:',r.duplicates); console.log('Quarentena:',r.quarantined); console.log('Falhas:',r.failures.length);"
            cat .cache/official-exam-ingestion-report.json >> "$GITHUB_STEP_SUMMARY"
          fi
