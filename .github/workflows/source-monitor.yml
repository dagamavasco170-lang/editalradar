name: Monitorar fontes de concursos

on:
  push:
    branches: [main]
    paths:
      - src/data/concursos.js
      - scripts/monitor-sources.mjs
      - scripts/monitor-sources.node-test.mjs
      - scripts/publish-discoveries.mjs
      - scripts/publish-discoveries.node-test.mjs
      - scripts/auto-resolve-discoveries.mjs
      - scripts/auto-resolve-discoveries.node-test.mjs
      - package.json
      - supabase/migrations/202611220004_auto_publish.sql
      - supabase/migrations/20261121225302_allow_web_search_leads_in_contest_discoveries.sql
      - .github/workflows/source-monitor.yml
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Verificar páginas de referência
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restaurar histórico de fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .cache/source-monitor-state.json
          key: source-monitor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            source-monitor-${{ runner.os }}-

      - name: Executar testes do monitor
        run: npm run test:monitor

      - name: Conferir fontes do catálogo
        id: monitor
        run: npm run monitor:sources
        env:
          MONITOR_CONCURRENCY: 4

      - name: Enviar oportunidades detectadas para a fila administrativa
        id: publish_discoveries
        if: steps.monitor.outputs.discovered_count != '0'
        run: npm run publish:discoveries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}


      - name: Instalar leitores de PDF e OCR em português
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por

      - name: Triar e cadastrar automaticamente oportunidades confirmadas
        id: resolve
        timeout-minutes: 30
        run: npm run auto:resolve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRIAGE_CONCURRENCY: 8
          TRIAGE_ATTEMPTS: 4
          TRIAGE_TIMEOUT_MS: 12000
          TRIAGE_RETRY_DELAY_MS: 600
          TRIAGE_OFFICIAL_COOLDOWN_HOURS: 6
          TRIAGE_EXTERNAL_COOLDOWN_HOURS: 24

      - name: Salvar histórico da verificação
        uses: actions/cache/save@v4
        with:
          path: .cache/source-monitor-state.json
          key: source-monitor-${{ runner.os }}-${{ github.run_id }}

      - name: Abrir ou atualizar issue para revisão e falhas
        if: always() && (steps.monitor.outputs.changed_count != '0' || steps.monitor.outputs.failed_count != '0' || steps.monitor.outputs.web_search_failed_count != '0' || steps.publish_discoveries.outcome == 'failure' || steps.resolve.outcome == 'failure' || steps.resolve.outputs.pending_count != '0')
        uses: actions/github-script@v7
        env:
          REPORT_PATH: .cache/source-monitor-report.json
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_discoveries.outcome }}
          TRIAGE_OUTCOME: ${{ steps.resolve.outcome }}
          TRIAGE_INSPECTED: ${{ steps.resolve.outputs.inspected_count }}
          TRIAGE_PUBLISHED: ${{ steps.resolve.outputs.published_count }}
          TRIAGE_UPDATED: ${{ steps.resolve.outputs.updated_count }}
          TRIAGE_PENDING: ${{ steps.resolve.outputs.pending_count }}
          TRIAGE_PENDING_TOTAL: ${{ steps.resolve.outputs.pending_total_count }}
          TRIAGE_ERRORS: ${{ steps.resolve.outputs.error_count }}
          TRIAGE_BASELINES_DISMISSED: ${{ steps.resolve.outputs.baseline_dismissed_count }}
          WEB_SEARCH_COUNT: ${{ steps.monitor.outputs.web_search_count }}
          WEB_SEARCH_FAILED: ${{ steps.monitor.outputs.web_search_failed_count }}
        with:
          script: |
            const fs = require("fs");
            const report = fs.existsSync(process.env.REPORT_PATH)
              ? JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"))
              : { changed: [], unavailable: [], added: [], removed: [], discoveries: [] };
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const findings = [
              ...report.changed.map(item => ({ ...item, category: "Conteúdo alterado" })),
              ...report.unavailable.map(item => ({ ...item, category: "Fonte indisponível" })),
              ...report.added.map(item => ({ ...item, category: "Nova fonte cadastrada" })),
              ...report.removed.map(item => ({ ...item, category: "Fonte removida" })),
              ...(report.discoveries || []).map(item => ({
                ...item,
                category: item.discovery_type === "web_search_lead"
                  ? "Pista da busca automática na internet (não confirmada)"
                  : item.discovery_type === "new_link" ? "Novo link de oportunidade oficial" : "Página oficial alterada para revisão"
              }))
            ];
            const details = findings.map(item => {
              const url = item.candidate_url || item.url;
              const message = item.title
                ? item.title + (item.context ? " — " + item.context : "")
                : item.message;
              return "- **" + item.category + ":** [" + url + "](" + url + ") — " + message;
            }).join("\n");
            const body = [
              "O monitor diário encontrou mudanças nas páginas vinculadas ao catálogo do EditalRadar.",
              "",
              details,
              "",
              "**Resultado do monitor:** " + String(process.env.MONITOR_OUTCOME || "não executado") + ".",
              "**Envio da fila:** " + String(process.env.PUBLISH_OUTCOME || "não necessário") + ".",
              "**Busca automática na internet:** " + String(process.env.WEB_SEARCH_COUNT || "0") + " pista(s) nova(s); falhas em " + String(process.env.WEB_SEARCH_FAILED || "0") + " consulta(s).",
              "**Triagem automática:** " + String(process.env.TRIAGE_OUTCOME || "não executada") + ". Analisadas: " + String(process.env.TRIAGE_INSPECTED || "0") + "; publicadas: " + String(process.env.TRIAGE_PUBLISHED || "0") + "; atualizadas: " + String(process.env.TRIAGE_UPDATED || "0") + "; pendentes nesta execução: " + String(process.env.TRIAGE_PENDING || "0") + "; pendentes totais no banco: " + String(process.env.TRIAGE_PENDING_TOTAL || "não confirmado") + "; linhas de base encerradas: " + String(process.env.TRIAGE_BASELINES_DISMISSED || "0") + "; falhas: " + String(process.env.TRIAGE_ERRORS || "0") + ".",
              "",
              "A triagem tenta novamente falhas temporárias de rede e limita a publicação automática a fontes oficiais com evidências suficientes de edital, órgão, cargo e esfera. Casos incompletos e PDFs sem texto legível permanecem na fila para revisão.",
              "",
              "O sistema não inventa vagas, requisitos, datas ou situação de inscrições. Confira sempre o edital oficial antes de tomar decisões.",
              "",
              "Relatório da execução: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId
            ].join("\n");

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request && issue.title.startsWith("[Monitor de fontes] Revisão necessária")
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body
              });
              core.info("Relatório anexado à issue #" + existing.number + ".");
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: "[Monitor de fontes] Revisão necessária",
                body
              });
              core.info("Issue #" + created.data.number + " criada.");
            }

      - name: Encerrar automaticamente alerta quando a triagem se recuperar
        if: always() && steps.monitor.outcome == 'success' && steps.monitor.outputs.changed_count == '0' && steps.monitor.outputs.failed_count == '0' && steps.monitor.outputs.web_search_failed_count == '0' && steps.publish_discoveries.outcome != 'failure' && steps.resolve.outcome == 'success' && steps.resolve.outputs.pending_count == '0' && steps.resolve.outputs.pending_total_count == '0' && steps.resolve.outputs.error_count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request && issue.title.startsWith("[Monitor de fontes] Revisão necessária")
            );
            if (!existing) {
              core.info("Nenhum alerta aberto para encerrar.");
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: "A triagem automática se recuperou: todas as fontes foram consultadas, não há novas alterações, pendências ou falhas técnicas. O alerta foi encerrado automaticamente. Execução: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId
            });
            await github.rest.issues.update({
              owner, repo, issue_number: existing.number, state: "closed", state_reason: "completed"
            });
            core.info("Alerta #" + existing.number + " encerrado automaticamente após recuperação confirmada.");

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoramento-fontes-${{ github.run_id }}
          path: |
            .cache/source-monitor-report.json
            .cache/source-monitor-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Exibir resumo
        if: always()
        run: |
          if [ -f .cache/source-monitor-report.md ]; then
            cat .cache/source-monitor-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
