name: Monitorar fontes de concursos

on:
  push:
    branches: [main]
    paths:
      - src/data/concursos.js
      - scripts/monitor-sources.mjs
      - scripts/monitor-sources.node-test.mjs
      - scripts/source-monitor-issue-report.mjs
      - scripts/publish-discoveries.mjs
      - scripts/publish-discoveries.node-test.mjs
      - scripts/auto-resolve-discoveries.mjs
      - scripts/auto-resolve-discoveries.node-test.mjs
      - scripts/import-official-exam-pdf.mjs
      - scripts/import-official-exam-pdf.node-test.mjs
      - scripts/import-official-exam-questions.mjs
      - scripts/import-official-exam-questions.node-test.mjs
      - supabase/migrations/20261126120000_official_exam_question_imports.sql
      - src/OfficialExamImportAdmin.jsx
      - scripts/google-news-url-resolver.mjs
      - scripts/google-news-url-resolver.node-test.mjs
      - package.json
      - supabase/migrations/202611220004_auto_publish.sql
      - supabase/migrations/20261121225302_allow_web_search_leads_in_contest_discoveries.sql
      - .github/workflows/source-monitor.yml
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Verificar páginas de referência
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restaurar histórico de fingerprints
        uses: actions/cache/restore@v6
        with:
          path: .cache/source-monitor-state.json
          key: source-monitor-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            source-monitor-${{ runner.os }}-

      - name: Executar testes do monitor
        run: npm run test:monitor

      - name: Conferir fontes do catálogo
        id: monitor
        run: npm run monitor:sources
        env:
          MONITOR_CONCURRENCY: 4

      - name: Enviar oportunidades detectadas para a fila administrativa
        id: publish_discoveries
        if: steps.monitor.outputs.discovered_count != '0'
        run: npm run publish:discoveries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}


      - name: Instalar leitores de PDF e OCR em português
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-por

      - name: Triar e cadastrar automaticamente oportunidades confirmadas
        id: resolve
        timeout-minutes: 30
        run: npm run auto:resolve
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRIAGE_CONCURRENCY: 8
          TRIAGE_ATTEMPTS: 4
          TRIAGE_TIMEOUT_MS: 12000
          TRIAGE_RETRY_DELAY_MS: 600
          TRIAGE_OFFICIAL_COOLDOWN_HOURS: 6
          TRIAGE_EXTERNAL_COOLDOWN_HOURS: 6
          TRIAGE_MAX_ITEMS: 40

      - name: Importar e publicar questões oficiais automaticamente
        id: exam_import
        if: always() && steps.monitor.outcome == 'success'
        timeout-minutes: 25
        run: npm run import:official-exams
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXAM_IMPORT_CONCURRENCY: 3
          EXAM_IMPORT_MAX_PAIRS: 20

      - name: Salvar histórico da verificação
        uses: actions/cache/save@v6
        with:
          path: .cache/source-monitor-state.json
          key: source-monitor-${{ runner.os }}-${{ github.run_id }}

      - name: Preparar relatório e fingerprint do monitor
        if: always() && (steps.monitor.outputs.changed_count != '0' || steps.monitor.outputs.failed_count != '0' || steps.monitor.outputs.new_restricted_count != '0' || steps.monitor.outputs.web_search_failed_count != '0' || steps.publish_discoveries.outcome == 'failure' || steps.resolve.outcome == 'failure' || steps.resolve.outputs.pending_count != '0' || steps.exam_import.outcome == 'failure')
        run: node scripts/source-monitor-issue-report.mjs
        env:
          REPORT_PATH: .cache/source-monitor-report.json
          ISSUE_REPORT_PATH: .cache/source-monitor-issue.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_discoveries.outcome }}
          TRIAGE_OUTCOME: ${{ steps.resolve.outcome }}
          TRIAGE_ELIGIBLE: ${{ steps.resolve.outputs.eligible_count }}
          TRIAGE_DEFERRED: ${{ steps.resolve.outputs.deferred_count }}
          TRIAGE_MAX_ITEMS: ${{ steps.resolve.outputs.max_items }}
          TRIAGE_INSPECTED: ${{ steps.resolve.outputs.inspected_count }}
          TRIAGE_PUBLISHED: ${{ steps.resolve.outputs.published_count }}
          TRIAGE_UPDATED: ${{ steps.resolve.outputs.updated_count }}
          TRIAGE_PENDING: ${{ steps.resolve.outputs.pending_count }}
          TRIAGE_PENDING_TOTAL: ${{ steps.resolve.outputs.pending_total_count }}
          TRIAGE_ERRORS: ${{ steps.resolve.outputs.error_count }}
          TRIAGE_BASELINES_DISMISSED: ${{ steps.resolve.outputs.baseline_dismissed_count }}
          WEB_SEARCH_COUNT: ${{ steps.monitor.outputs.web_search_count }}
          WEB_SEARCH_FAILED: ${{ steps.monitor.outputs.web_search_failed_count }}

      - name: Abrir ou atualizar issue para revisão e falhas
        if: always() && (steps.monitor.outputs.changed_count != '0' || steps.monitor.outputs.failed_count != '0' || steps.monitor.outputs.new_restricted_count != '0' || steps.monitor.outputs.web_search_failed_count != '0' || steps.publish_discoveries.outcome == 'failure' || steps.resolve.outcome == 'failure' || steps.resolve.outputs.pending_count != '0')
        uses: actions/github-script@v8
        env:
          ISSUE_REPORT_PATH: .cache/source-monitor-issue.json
        with:
          script: |
            const fs = require("fs");
            if (!fs.existsSync(process.env.ISSUE_REPORT_PATH)) {
              throw new Error("Relatório com fingerprint não foi gerado.");
            }
            const { body, fingerprint } = JSON.parse(fs.readFileSync(process.env.ISSUE_REPORT_PATH, "utf8"));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request && issue.title.startsWith("[Monitor de fontes] Revisão necessária")
            );

            if (!existing) {
              const created = await github.rest.issues.create({
                owner, repo,
                title: "[Monitor de fontes] Revisão necessária",
                body
              });
              core.info("Issue #" + created.data.number + " criada com fingerprint " + fingerprint + ".");
              return;
            }

            const previousFingerprint = existing.body?.match(
              /<!-- source-monitor-fingerprint:([a-f0-9]{64}) -->/
            )?.[1];

            if (previousFingerprint === fingerprint) {
              core.info("Issue #" + existing.number + " sem mudanças relevantes; comentário repetido suprimido.");
              return;
            }

            if (previousFingerprint) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: "O monitor detectou uma mudança relevante desde a última atualização.\n\n" + body
              });
            } else {
              core.info("Fingerprint inicial registrado em issue legada sem criar comentário de migração.");
            }

            await github.rest.issues.update({
              owner, repo, issue_number: existing.number, body
            });
            core.info("Issue #" + existing.number + " atualizada; fingerprint " + fingerprint + ".");
            
      - name: Encerrar automaticamente alerta quando a triagem se recuperar
        if: always() && steps.monitor.outcome == 'success' && steps.monitor.outputs.changed_count == '0' && steps.monitor.outputs.failed_count == '0' && steps.monitor.outputs.restricted_count == '0' && steps.monitor.outputs.web_search_failed_count == '0' && steps.publish_discoveries.outcome != 'failure' && steps.resolve.outcome == 'success' && steps.resolve.outputs.pending_count == '0' && steps.resolve.outputs.pending_total_count == '0' && steps.resolve.outputs.error_count == '0' && steps.exam_import.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request && issue.title.startsWith("[Monitor de fontes] Revisão necessária")
            );
            if (!existing) {
              core.info("Nenhum alerta aberto para encerrar.");
              return;
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: "A triagem automática se recuperou: todas as fontes foram consultadas, não há novas alterações, pendências ou falhas técnicas. O alerta foi encerrado automaticamente. Execução: " + context.serverUrl + "/" + owner + "/" + repo + "/actions/runs/" + context.runId
            });
            await github.rest.issues.update({
              owner, repo, issue_number: existing.number, state: "closed", state_reason: "completed"
            });
            core.info("Alerta #" + existing.number + " encerrado automaticamente após recuperação confirmada.");

      - name: Salvar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitoramento-fontes-${{ github.run_id }}
          path: |
            .cache/source-monitor-report.json
            .cache/source-monitor-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Exibir resumo
        if: always()
        run: |
          if [ -f .cache/source-monitor-report.md ]; then
            cat .cache/source-monitor-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
