name: Android emulator smoke test

on:
  push:
    branches: [main]
    paths:
      - "android/app/src/**"
      - "android/app/build.gradle"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/gradle.properties"
      - ".github/workflows/android-emulator-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/app/src/**"
      - "android/app/build.gradle"
      - "android/build.gradle"
      - "android/settings.gradle"
      - "android/gradle.properties"
      - ".github/workflows/android-emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editalradar-android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install and launch on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --max-workers=2

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb shell am force-stop br.com.editalradar.app
            adb shell am start -W -n br.com.editalradar.app/.MainActivity
            sleep 20
            if ! adb shell pidof br.com.editalradar.app >/dev/null; then
              adb logcat -d -s AndroidRuntime:E
              echo "O processo do EditalRadar não permaneceu ativo após a inicialização."
              exit 1
            fi
            if ! adb shell dumpsys activity activities | grep -Fq "br.com.editalradar.app/.MainActivity"; then
              adb logcat -d -s AndroidRuntime:E
              echo "A MainActivity não foi encontrada na pilha de atividades."
              exit 1
            fi
            adb shell uiautomator dump /sdcard/editalradar-window.xml >/dev/null
            adb shell cat /sdcard/editalradar-window.xml | grep -Fq "Atualizações"
            if adb logcat -d -s AndroidRuntime:E | grep -Fq "br.com.editalradar.app"; then
              echo "Foi detectada uma exceção fatal relacionada ao EditalRadar."
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
            echo "Smoke test concluído: APK instalado, MainActivity ativa e interface nativa visível."
