name: Supabase migration and pgTAP checks

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay-and-pgtap:
    name: Replay migrations and run pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The repository intentionally has no committed Supabase config.toml yet.
      # Generate an ephemeral default config in this disposable GitHub runner.
      - name: Initialize ephemeral local Supabase config
        run: supabase init

      - name: Start disposable local Supabase
        run: supabase start

      - name: Replay all migrations and run database tests
        run: supabase test db

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
