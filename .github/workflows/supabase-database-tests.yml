name: Supabase migration and pgTAP checks

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay-and-pgtap:
    name: Replay migrations and run pgTAP
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.4.0

      - name: Show Supabase CLI version
        run: supabase --version

      # CLI v3.4.0 creates an ephemeral config.jsonc in this disposable runner.
      # The job is intentionally unlinked and uses only the local stack.
      - name: Initialize ephemeral local Supabase config
        run: supabase init

      - name: Start disposable local Supabase
        run: supabase start

      - name: Replay all migrations and run database tests
        run: supabase test db

      - name: Stop disposable local Supabase
        if: always()
        run: supabase stop --no-backup
