name: Publicar Edge Function de alertas

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar função no Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validar token de acesso
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Cadastre SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions antes de publicar."
            exit 1
          fi

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Publicar Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy send-contest-email-alerts --project-ref xrdtqbatynoofkjtjgeq
