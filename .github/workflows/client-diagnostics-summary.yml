name: Resumo diário de diagnósticos do cliente
on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/client-diagnostics-summary.yml"
permissions:
  issues: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar erros recentes e publicar somente métricas agregadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        uses: actions/github-script@v7
        with:
          script: |
            if (!process.env.SUPABASE_URL || !process.env.SUPABASE_SERVICE_ROLE_KEY) {
              core.warning("Configure SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY em GitHub Actions secrets para ativar o resumo diário.");
              return;
            }
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
            const endpoint = process.env.SUPABASE_URL.replace(/\/$/, "") +
              "/rest/v1/app_diagnostics?select=event,platform,created_at&level=eq.error&created_at=gte." +
              encodeURIComponent(since) + "&order=created_at.desc&limit=500";
            const supabaseKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
            const jwtParts = supabaseKey.split(".");
            let credentialRole = supabaseKey.startsWith("sb_secret_") ? "secret" : supabaseKey.startsWith("sb_publishable_") ? "publishable" : "unknown";
            if (jwtParts.length === 3) {
              try {
                const payload = JSON.parse(Buffer.from(jwtParts[1], "base64url").toString("utf8"));
                credentialRole = typeof payload.role === "string" ? payload.role : "unknown";
              } catch { /* A chave não é um JWT legível; nunca registrar seu conteúdo. */ }
            }
            if (credentialRole === "anon" || credentialRole === "publishable") {
              throw new Error(
                "SUPABASE_SERVICE_ROLE_KEY está configurada como credencial pública (" + credentialRole + "). Atualize o secret no GitHub com a chave service_role do mesmo projeto; não libere acesso público à tabela de diagnósticos."
              );
            }
            // New sb_secret_* keys authenticate via apikey only; legacy service_role JWTs
            // also require Authorization: Bearer for compatibility with older projects.
            const headers = {
              apikey: supabaseKey,
              Accept: "application/json"
            };
            if (!supabaseKey.startsWith("sb_secret_")) {
              headers.Authorization = "Bearer " + supabaseKey;
            }
            const response = await fetch(endpoint, { headers });
            if (!response.ok) {
              const details = await response.text();
              const safeDetails = details
                .replaceAll(supabaseKey, "[REDACTED]")
                .replace(/Bearer\\s+[A-Za-z0-9._-]+/gi, "Bearer [REDACTED]")
                .replace(/sb_secret_[A-Za-z0-9]+/g, "sb_secret_[REDACTED]")
                .slice(0, 500);
              core.error("Supabase REST rejected the request (HTTP " + response.status + "). Key format: " +
                (supabaseKey.startsWith("sb_secret_") ? "new secret key" : supabaseKey.startsWith("eyJ") ? "legacy JWT" : "unknown") +
                "; project ref in URL: " + (new URL(process.env.SUPABASE_URL).hostname.split(".")[0] || "unrecognized") +
                "; response: " + safeDetails);
              throw new Error("Supabase diagnostics query failed: HTTP " + response.status);
            }
            const logs = await response.json();
            if (!logs.length) {
              core.info("Nenhum erro de cliente nas últimas 24 horas.");
              return;
            }
            const groups = new Map();
            for (const row of logs) {
              const key = (row.platform || "unknown") + " / " + (row.event || "unknown");
              groups.set(key, (groups.get(key) || 0) + 1);
            }
            const day = new Date().toISOString().slice(0, 10);
            const title = "[Diagnósticos] Resumo de erros do cliente — " + day;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100
            });
            if (issues.some(issue => issue.title === title)) {
              core.info("Resumo já existe; evitando issue duplicada.");
              return;
            }
            const summary = Array.from(groups.entries())
              .sort((a, b) => b[1] - a[1])
              .map(([name, count]) => "- " + name + ": " + count)
              .join("\n");
            const body = [
              "Resumo agregado de falhas reportadas pelo site e pelo aplicativo nas últimas 24 horas.",
              "",
              "**Total de registros de erro:** " + logs.length + (logs.length === 500 ? " (amostra limitada a 500)" : ""),
              "",
              "**Eventos por plataforma e tipo (sem mensagens, stack traces, IDs de usuário ou IP):**",
              summary,
              "",
              "Os detalhes privados permanecem no banco de diagnósticos com retenção de 30 dias.",
              "Commit do workflow: " + context.sha
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body
            });
