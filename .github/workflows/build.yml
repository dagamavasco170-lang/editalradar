name: Test, build and deploy EditalRadar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Executar testes
        run: npm test

  build:
    name: Compilar aplicação
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Compilar para produção
        run: npm run build
      - name: Verificar caminhos do GitHub Pages
        run: |
          test -s dist/index.html
          grep -q "/editalradar/assets/" dist/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v5
