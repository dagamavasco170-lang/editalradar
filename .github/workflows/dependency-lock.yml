name: Manter lockfile do npm

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/dependency-lock.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: npm-lockfile-main
  cancel-in-progress: false

jobs:
  lockfile:
    name: Gerar e versionar package-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch principal
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolver dependências e gerar lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validar árvore de dependências, testes e build
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Abrir PR para atualização do lockfile
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/npm-lockfile-sync
          delete-branch: true
          title: "chore: sincronizar package-lock.json"
          commit-message: "build: sync npm lockfile"
          body: |
            Atualização automática do package-lock.json após validar instalação, testes e build.
            Esta PR evita commits automáticos diretos na main.
            Revise as alterações antes de integrar.
          labels: dependencies, automated
          add-paths: package-lock.json
