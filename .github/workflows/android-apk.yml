name: Build EditalRadar Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
      - name: Run Android lint
        working-directory: android
        run: gradle lintDebug --no-daemon
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Validate APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: EditalRadar-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
