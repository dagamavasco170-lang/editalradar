# Catálogo amplo de matérias: fontes privadas de estudo, sem coleta em órgãos públicos.
name: Gerar e revisar questões automaticamente

on:
  schedule:
    # Primeira execução às 07:30 e segunda tentativa de recuperação às 19:30 (Brasília).
    # O limite de oito execuções no banco continua impedindo chamadas extras de IA.
    - cron: "30 10 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/question-automation.yml"
      - ".github/scripts/question-automation.mjs"
      - "supabase/functions/question-factory/**"

permissions:
  contents: read

concurrency:
  group: question-automation
  cancel-in-progress: false

jobs:
  generate-and-review:
    name: Descobrir matérias, elaborar questões e revisar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar script de automação
        run: node --check .github/scripts/question-automation.mjs

      - name: Executar descoberta, elaboração e revisão autônomas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node .github/scripts/question-automation.mjs
